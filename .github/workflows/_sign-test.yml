name: _Sign Test (standalone)

# Smoke test of the composite action in this repository: builds a tiny .NET hello-world, signs its DLL
# through the action's `files` input and its exe the way a build tool's sign hook would (by running
# code-sign-file.cmd in a later step), then verifies both signatures. Validates the OIDC + Key Vault path
# and the per-file entry point in isolation.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build dummy exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work -Force | Out-Null
          Set-Location work
          dotnet new console -n DummyApp --force
          dotnet publish DummyApp/DummyApp.csproj -c Release -r win-x64 --self-contained false -o out
          Get-ChildItem out

      - name: Sign DLL (files input)
        uses: ./
        with:
          files: work/out/DummyApp.dll
          description: DummyApp

      # A sign hook runs a plain command line in a later step: the command must be on PATH.
      - name: Sign exe (per-file command)
        shell: cmd
        run: code-sign-file.cmd "%GITHUB_WORKSPACE%\work\out\DummyApp.exe"

      - name: Show sign log
        if: always()
        shell: pwsh
        run: if (Test-Path $env:CODE_SIGN_LOG) { Get-Content $env:CODE_SIGN_LOG } else { 'nothing was signed' }

      - name: Verify signatures (signtool)
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          foreach ($file in 'work/out/DummyApp.dll', 'work/out/DummyApp.exe') {
            & $signtool.FullName verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $file" }
          }

      - name: Verify signatures (PowerShell)
        shell: pwsh
        run: |
          foreach ($file in 'work/out/DummyApp.dll', 'work/out/DummyApp.exe') {
            $sig = Get-AuthenticodeSignature $file
            $sig | Format-List *
            if ($sig.Status -ne 'Valid') {
              throw "Signature status of ${file}: $($sig.Status)"
            }
          }
          $logged = @(Select-String -LiteralPath $env:CODE_SIGN_LOG -Pattern ': signed$')
          if ($logged.Count -ne 2) { throw "expected 2 signed entries in the sign log, found $($logged.Count)" }

      - name: Upload signed files (for inspection)
        uses: actions/upload-artifact@v7
        with:
          name: signed-dummy
          path: |
            work/out/DummyApp.exe
            work/out/DummyApp.dll
          retention-days: 1
