name: _Sign Test (standalone)

# Smoke test of this repository's two signing paths, each on a tiny .NET hello-world:
#   sign      — the composite action: signs the DLL through the `files` input and the exe the way a build
#               tool's sign hook would (code-sign-file.cmd in a later step), then verifies both.
#   reusable  — the layer-2 workflow (sign.yml): an unsigned artifact built in a job with no credential,
#               signed by the reusable workflow, verified in a third job that again holds no credential.
# Validates the OIDC + Key Vault path, the per-file entry point and the reusable workflow in isolation.

on:
  workflow_dispatch:

permissions: {}

jobs:
  sign:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build dummy exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work -Force | Out-Null
          Set-Location work
          dotnet new console -n DummyApp --force
          dotnet publish DummyApp/DummyApp.csproj -c Release -r win-x64 --self-contained false -o out
          Get-ChildItem out

      - name: Sign DLL (files input)
        uses: ./
        with:
          files: work/out/DummyApp.dll
          description: DummyApp

      # A sign hook runs a plain command line in a later step: the command must be on PATH.
      - name: Sign exe (per-file command)
        shell: cmd
        run: code-sign-file.cmd "%GITHUB_WORKSPACE%\work\out\DummyApp.exe"

      - name: Show sign log
        if: always()
        shell: pwsh
        run: if (Test-Path $env:CODE_SIGN_LOG) { Get-Content $env:CODE_SIGN_LOG } else { 'nothing was signed' }

      - name: Verify signatures (signtool)
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          foreach ($file in 'work/out/DummyApp.dll', 'work/out/DummyApp.exe') {
            & $signtool.FullName verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $file" }
          }

      - name: Verify signatures (PowerShell)
        shell: pwsh
        run: |
          foreach ($file in 'work/out/DummyApp.dll', 'work/out/DummyApp.exe') {
            $sig = Get-AuthenticodeSignature $file
            $sig | Format-List *
            if ($sig.Status -ne 'Valid') {
              throw "Signature status of ${file}: $($sig.Status)"
            }
          }
          $logged = @(Select-String -LiteralPath $env:CODE_SIGN_LOG -Pattern ': signed$')
          if ($logged.Count -ne 2) { throw "expected 2 signed entries in the sign log, found $($logged.Count)" }

      - name: Upload signed files (for inspection)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-dummy
          path: |
            work/out/DummyApp.exe
            work/out/DummyApp.dll
          retention-days: 1

  reusable-build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build dummy exe
        shell: pwsh
        run: |
          dotnet new console -n DummyApp -o work --force
          dotnet publish work/DummyApp.csproj -c Release -r win-x64 --self-contained false -o out
          New-Item -ItemType Directory -Path unsigned/lib -Force | Out-Null
          Copy-Item out/DummyApp.exe unsigned/
          Copy-Item out/DummyApp.dll unsigned/lib/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: unsigned
          if-no-files-found: error
          retention-days: 1

  reusable-sign:
    needs: reusable-build
    uses: ./.github/workflows/sign.yml
    permissions:
      id-token: write
      contents: read
    with:
      artifact: unsigned
      files: |
        DummyApp.exe
        lib/DummyApp.dll
      signed-artifact: signed
      description: DummyApp

  reusable-check:
    needs: reusable-sign
    runs-on: windows-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: signed

      - name: Verify signatures outside the signing job
        shell: pwsh
        run: |
          $bad = Get-ChildItem signed -Recurse -File | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { throw "Missing or invalid signature: $($bad.Name -join ', ')" }
          Get-ChildItem signed -Recurse -File | ForEach-Object { "$($_.Name): $((Get-AuthenticodeSignature $_.FullName).SignerCertificate.Subject)" }
