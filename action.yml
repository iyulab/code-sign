name: 'Sign Windows Binaries (iyulab)'
description: 'Authenticode-signs Windows PE files with the iyulab GlobalSign EV certificate via Azure Key Vault OIDC, and prepares the job so later steps can sign more files one at a time'

inputs:
  files:
    description: 'Newline-separated list of file paths or glob patterns to sign (relative to workspace or absolute). Glob patterns are expanded via PowerShell Resolve-Path. Leave empty to only prepare the job for later signing (see README).'
    required: false
    default: ''
  client-id:
    description: 'Azure AD app (service principal) client ID.'
    required: false
    default: '293d5452-469f-4988-93c9-0aee0f2d0846'
  tenant-id:
    description: 'Azure AD tenant ID.'
    required: false
    default: '66683f75-fa9e-4325-84e1-9253c1fc8cb7'
  key-vault-url:
    description: 'Azure Key Vault base URL.'
    required: false
    default: 'https://kv-codesign-iyulab.vault.azure.net/'
  certificate-name:
    description: 'Certificate name in the Key Vault.'
    required: false
    default: 'globalsign-ev-codesign'
  timestamp-url:
    description: 'RFC 3161 timestamp server URL.'
    required: false
    default: 'http://timestamp.globalsign.com/tsa/r6advanced1'
  description:
    description: 'Description shown in the signature (AzureSignTool --description), e.g. the product name.'
    required: false
    default: ''
  description-url:
    description: 'URL shown in the signature (AzureSignTool --description-url).'
    required: false
    default: ''

outputs:
  sign-command:
    description: 'Absolute path of code-sign-file.cmd, which signs the one file given as its argument. Also exported as CODE_SIGN_FILE, and its folder is put on PATH.'
    value: ${{ steps.prepare.outputs.sign-command }}
  log:
    description: 'Absolute path of the log every signed file is appended to (also exported as CODE_SIGN_LOG).'
    value: ${{ steps.prepare.outputs.log }}

runs:
  using: 'composite'
  steps:
    # Everything that runs here holds the job's OIDC token, so every piece of third-party code is pinned:
    # the login action to a commit (its tag in the trailing comment), AzureSignTool to an exact version.
    # Bump them deliberately.
    - name: Azure login (OIDC)
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        allow-no-subscriptions: true

    # Installed into a folder of this job rather than globally, so a copy already on the runner (any
    # version) is never the one that runs.
    - name: Install AzureSignTool
      id: tool
      shell: pwsh
      env:
        AZURE_SIGN_TOOL_VERSION: '7.0.1'
      run: |
        $ErrorActionPreference = 'Stop'
        $dir = Join-Path $env:RUNNER_TEMP 'code-sign/tool'
        $exe = Join-Path $dir ($IsWindows ? 'AzureSignTool.exe' : 'AzureSignTool')
        if (-not (Test-Path -LiteralPath $exe)) {
          dotnet tool install AzureSignTool --version $env:AZURE_SIGN_TOOL_VERSION --tool-path $dir
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install failed with exit code $LASTEXITCODE" }
        }
        Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$exe"

    # Everything scripts/sign-file.ps1 needs, exported for the rest of the job, so a build tool's sign
    # hook (which runs in a later step) can sign files one at a time with the same settings.
    - name: Prepare signing
      id: prepare
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        TOOL: ${{ steps.tool.outputs.path }}
        KVU: ${{ inputs.key-vault-url }}
        KVC: ${{ inputs.certificate-name }}
        TR_URL: ${{ inputs.timestamp-url }}
        DESCRIPTION: ${{ inputs.description }}
        DESCRIPTION_URL: ${{ inputs.description-url }}
      run: |
        $ErrorActionPreference = 'Stop'

        $dir = Join-Path $env:RUNNER_TEMP 'code-sign'
        New-Item -ItemType Directory -Path $dir -Force | Out-Null
        $script = Join-Path $env:ACTION_PATH 'scripts/sign-file.ps1'
        $log = Join-Path $dir 'sign.log'

        # A command a sign hook can name without knowing where this action lives. The script's path is
        # written into it: a batch file found through PATH cannot rely on %~dp0 for its own folder.
        $command = Join-Path $dir 'code-sign-file.cmd'
        Set-Content -LiteralPath $command -Value "@pwsh -NoProfile -ExecutionPolicy Bypass -File `"$script`" %*"
        Add-Content -LiteralPath $env:GITHUB_PATH -Value $dir

        Add-Content -LiteralPath $env:GITHUB_ENV -Value @(
          "CODE_SIGN_TOOL=$env:TOOL"
          "CODE_SIGN_KEY_VAULT_URL=$env:KVU"
          "CODE_SIGN_CERTIFICATE=$env:KVC"
          "CODE_SIGN_TIMESTAMP_URL=$env:TR_URL"
          "CODE_SIGN_DESCRIPTION=$env:DESCRIPTION"
          "CODE_SIGN_DESCRIPTION_URL=$env:DESCRIPTION_URL"
          "CODE_SIGN_LOG=$log"
          "CODE_SIGN_FILE=$command"
        )
        Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @(
          "sign-command=$command"
          "log=$log"
        )

    - name: Sign files
      if: inputs.files != ''
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
        FILES_INPUT: ${{ inputs.files }}
      run: |
        $ErrorActionPreference = 'Stop'

        # Parse newline-separated list. Each line can be a literal path or a glob pattern.
        $patterns = @($env:FILES_INPUT -split "`n" |
          ForEach-Object { $_.Trim() } |
          Where-Object { $_ })

        # Expand patterns into concrete file paths via Resolve-Path.
        # Deduplicate while preserving order.
        $resolved = [System.Collections.Generic.List[string]]::new()
        $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
        foreach ($pattern in $patterns) {
          $found = Resolve-Path -Path $pattern -ErrorAction SilentlyContinue
          if (-not $found) {
            throw "No files matched pattern: $pattern"
          }
          foreach ($match in $found) {
            $path = $match.ProviderPath
            if ($seen.Add($path)) {
              $resolved.Add($path) | Out-Null
            }
          }
        }

        Write-Host "Resolved $($resolved.Count) file(s) to sign from $($patterns.Count) pattern(s)."

        $signFile = Join-Path $env:ACTION_PATH 'scripts/sign-file.ps1'
        foreach ($file in $resolved) {
          Write-Host "::group::Signing $file"
          & $signFile $file
          Write-Host "::endgroup::"
        }

        Write-Host "Signed $($resolved.Count) file(s) successfully."
